[tool:pytest]
# Configuration pytest pour MSPR-TPRE-601-ML

# Répertoires de tests
testpaths = tests

# Fichiers de test
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Options par défaut
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Marqueurs personnalisés
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    performance: Tests de performance
    slow: Tests lents
    database: Tests de base de données
    prophet: Tests du modèle Prophet
    data_processing: Tests de traitement des données

# Filtres d'avertissements
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Configuration de la couverture
[coverage:run]
source = .
omit = 
    tests/*
    */test_*
    setup.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# Configuration HTML
[coverage:html]
directory = htmlcov 